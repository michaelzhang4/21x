<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train of Thought">
<meta name="description" content="Ten mental maths and ten linear algebra questions a day, with a timer and a score. Made for the morning train.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23123026'/%3E%3Cpath d='M10 44 L54 20' stroke='%23e8b84b' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='14' cy='42' r='5' fill='%23fffdf7' stroke='%231b2130' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23fffdf7' stroke='%231b2130' stroke-width='2'/%3E%3Ccircle cx='50' cy='22' r='5' fill='%23fffdf7' stroke='%231b2130' stroke-width='2'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Train of Thought — daily mental maths &amp; linear algebra</title>
<style>
 :root{
  --text:#eef2ef; --muted:#97a8a0; --line:#2b3a34; --panel:#16221e; --panel2:#1d2b26;
  --gold:#e8b84b; --gold2:#f6d27c; --good:#5ed38c; --bad:#ff6f6f; --warn:#ffbe5c;
  --ink:#1b2130; --tri:#13a38a; --sq:#e8961c; --pent:#d6455d;
  --math:"Cambria Math",Cambria,"STIX Two Text","Times New Roman",Times,serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
 }
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{margin:0;height:100%}
 body{background:#0c1512 radial-gradient(130% 75% at 50% 0%,#18402f 0%,#10241c 55%,#0b1411 100%) fixed;color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
 button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
 button:disabled{opacity:.38;cursor:default}
 a{color:var(--gold2)}
 #app{height:100%}
 .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .dim{color:var(--muted);font-weight:500}

 /* ---------- menus ---------- */
 .menu{max-width:540px;margin:0 auto;padding:calc(var(--sat) + 18px) 16px calc(var(--sab) + 28px);min-height:100%}
 .hero{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14.5px}
 .logo{font:700 46px/1.02 var(--math);color:var(--gold);text-align:center;margin:18px 0 0;text-shadow:0 3px 0 #0007;letter-spacing:-.5px}
 .logo i{color:var(--gold2)}
 .tag{text-align:center;color:var(--muted);margin:6px 0 16px}
 .day{display:block;width:100%;text-align:left;padding:14px 16px 12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);margin:10px 0}
 .day:active{background:#243630}
 .day .dh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
 .day b{font-size:20px;color:var(--gold2)}
 .day .st{font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
 .day small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
 .day.done{border-color:#2f6f4c;background:#173025}
 .day .line{margin:10px 2px 2px}
 .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
 .btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 10px;font-weight:600}
 .btn:active{background:#243630}
 .btn.gold{background:linear-gradient(#f6d27c,#e2a83a);color:#1d1503;border:0}
 .foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:24px}
 .hl{color:var(--gold2)}
 .menu .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
 .top{display:flex;align-items:center;gap:10px;margin:0 0 12px}
 .top h2{margin:0;font-size:22px;color:var(--gold2)}
 .ib{width:42px;height:42px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:20px;line-height:1;flex:none;display:inline-flex;align-items:center;justify-content:center}
 .sect{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
 .sect h3{margin:0 0 8px;font-size:15px;color:var(--gold2);letter-spacing:.3px}
 .sect p,.sect li{color:#d8e0dc;font-size:15px}
 .sect p{margin:6px 0}
 .sect ul{margin:6px 0;padding-left:20px}
 .sect li{margin:3px 0}
 .note{color:var(--muted);font-size:13.5px}
 .seg{display:flex;flex-wrap:wrap;gap:6px}
 .seg button{flex:1 1 auto;min-width:56px;padding:9px 10px;border-radius:10px;background:#0f1916;border:1px solid var(--line);font-weight:600}
 .seg button.on{background:var(--gold);color:#1d1503;border-color:var(--gold)}
 .sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #ffffff0d}
 .sw:first-of-type{border-top:0}
 .sw span small{display:block;color:var(--muted);font-size:13px}
 .tog{width:52px;height:30px;border-radius:99px;background:#2a3833;border:0;position:relative;flex:none}
 .tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#cfd8d3;transition:left .15s}
 .tog.on{background:var(--gold)}
 .tog.on::after{left:25px;background:#fff}
 .err{background:#3a1717;border:1px solid #7a2a2a;border-radius:12px;padding:10px 12px;color:#ffd0d0}
 .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
 .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
 .tile b{display:block;font-size:26px;line-height:1.15;color:var(--gold2);font-variant-numeric:tabular-nums}
 .tile small{color:var(--muted);font-size:13px}
 .rec{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
 .rec td,.rec th{padding:5px 2px;border-top:1px solid #ffffff10;text-align:left}
 .rec th{color:var(--muted);font-weight:600;font-size:13px;border-top:0}
 .rec td.r,.rec th.r{text-align:right}
 .pill{display:inline-block;min-width:3.2em;text-align:center;border-radius:99px;padding:1px 7px;font-weight:700;font-size:13.5px;background:#0d1714}
 .pill.p10{background:#1d5a3a;color:#d7ffe6}
 kbd{background:#0d1714;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:600 13px system-ui,sans-serif}

 /* ---------- the line map: one stop per question ---------- */
 .line{display:flex;align-items:center;justify-content:space-between;position:relative;height:16px;--p:0%}
 .line::before,.line::after{content:"";position:absolute;left:5px;top:50%;height:3px;margin-top:-1.5px;border-radius:2px}
 .line::before{right:5px;background:#ffffff1c}
 .line::after{width:calc((100% - 10px) * var(--f,0));background:var(--gold);opacity:.75;transition:width .3s}
 .line i{position:relative;z-index:1;width:12px;height:12px;border-radius:50%;background:#0d1714;border:2px solid #3d4f47;flex:none}
 .line i.ok{background:var(--good);border-color:var(--good)}
 .line i.no{background:var(--bad);border-color:var(--bad)}
 .line i.sk{background:#0d1714;border-color:var(--bad)}
 .line i.cur{border-color:var(--gold);background:#2b2410;box-shadow:0 0 0 3px #e8b84b33;animation:pulse 1.6s ease-in-out infinite}
 @keyframes pulse{50%{box-shadow:0 0 0 6px #e8b84b10}}
 .line.big{height:22px}
 .line.big i{width:18px;height:18px;border-width:3px}

 /* ---------- play screen ---------- */
 .game{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;padding-top:var(--sat);user-select:none;-webkit-user-select:none;overflow:hidden}
 .bar{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
 .bar .ttl{font-weight:800;color:var(--gold2);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .bar .sp{flex:1}
 .chip{display:inline-flex;align-items:center;gap:5px;background:#0d1714c0;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-weight:700;font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
 .skip{height:34px;border-radius:99px;background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:13.5px;padding:0 12px}
 .game>.line{margin:6px 20px 0}
 .stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px 14px;position:relative}
 .qp{color:var(--muted);font-size:14px;font-weight:600;text-align:center;letter-spacing:.2px}
 .qp .v{font-family:var(--math);font-size:1.15em}
 .qx{font-family:var(--math);font-size:40px;line-height:1.25;text-align:center;white-space:nowrap;max-width:100%;font-variant-numeric:lining-nums}
 .fbk{min-height:1.4em;text-align:center;font-size:15.5px;line-height:1.4;padding:0 4px;max-width:100%}
 .fbk b{font-size:17px}
 .why{color:#cfdad5;font-size:14.5px;line-height:1.55;margin-top:3px}
 .why .mat{font-size:.95em}
 .paused .stage,.paused .ans{visibility:hidden}
 .pad{padding:8px 10px calc(var(--sab) + 10px);background:#08100dd9;border-top:1px solid #ffffff12}
 .ans{height:58px;border-radius:14px;background:#0b1512;border:2px solid var(--gold);box-shadow:0 0 0 3px #e8b84b22;display:flex;align-items:center;justify-content:center;gap:.3em;
  font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;margin-bottom:8px;padding:0 10px}
 .ans .lab{font:italic 600 28px var(--math);color:var(--gold)}
 .ans .lab .w{font:600 16px system-ui,sans-serif;color:var(--muted);margin:0}
 .ans .lab .o{margin:0 .12em}
 .ans .eqs{color:var(--muted);font-weight:500}
 .ans .ph{color:#5c6d66;animation:blink 1s steps(1) infinite}
 @keyframes blink{50%{opacity:.2}}
 .ans.good{border-color:var(--good);background:#0f2a1b;box-shadow:0 0 0 3px #5ed38c33}
 .ans.bad{border-color:var(--bad);background:#2a1212;box-shadow:0 0 0 3px #ff6f6f2a;animation:shake .32s}
 .ans.bad .you{text-decoration:line-through;text-decoration-thickness:2px;color:#ffb3b3}
 @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
 .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;transition:opacity .15s}
 .keys.off{opacity:.38;pointer-events:none}
 .key{height:54px;border-radius:12px;background:#1d2925;border:1px solid #2c3b35;font-size:24px;font-weight:600;padding:0}
 .key:active{background:#31423b}
 .key.alt{background:#16201d;color:#c9d6d0;font-size:21px}
 .go{display:block;width:100%;height:56px;margin-top:7px;border-radius:14px;border:0;background:linear-gradient(#f6d27c,#e2a83a);color:#1d1503;font-weight:800;font-size:18px}
 .go:active{background:#d99f30}
 @media (max-height:700px){
  .bar{padding:6px 10px 2px} .ib{width:38px;height:38px}
  .ans{height:50px;font-size:27px;margin-bottom:6px} .key{height:46px;font-size:22px} .keys{gap:6px}
  .go{height:50px;margin-top:6px} .qx{line-height:1.2}
 }

 /* ---------- maths typesetting ---------- */
 .v{font-style:italic}
 .o{margin:0 .22em}
 .w{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.5em;color:var(--muted);font-weight:600;margin:0 .45em;vertical-align:.12em;letter-spacing:.2px}
 .fn{font-style:normal;margin-right:.08em}
 .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .07em}
 .fr-n{padding:0 .12em .05em}
 .fr-d{border-top:max(1.5px,.065em) solid currentColor;padding:.05em .12em 0}
 .ex{font-size:.62em;vertical-align:.78em;line-height:0;margin-left:.03em}
 .mat{display:inline-grid;grid-template-columns:repeat(var(--c),auto);gap:.06em .55em;position:relative;padding:.1em .42em;margin:0 .12em;vertical-align:middle;line-height:1.2}
 .mat>span{text-align:center;white-space:nowrap}
 .mat::before,.mat::after{content:"";position:absolute;top:0;bottom:0;width:.28em;border:max(1.5px,.07em) solid currentColor}
 .mat::before{left:0;border-right:0}
 .mat::after{right:0;border-left:0}
 .mat.det::before{border-width:0 0 0 max(1.5px,.07em)}
 .mat.det::after{border-width:0 max(1.5px,.07em) 0 0}
 .nrm{display:inline-block;vertical-align:middle;border-left:.2em double currentColor;border-right:.2em double currentColor;padding:0 .1em;margin:0 .1em}
 .nrm .mat::before,.nrm .mat::after{display:none}
 .msup{display:inline-flex;align-items:flex-start;vertical-align:middle}
 .msup sup{font-size:.6em;margin-left:.06em;line-height:1}
 .sys{display:inline-flex;flex-direction:column;align-items:flex-start;gap:.12em;position:relative;padding-left:.7em;vertical-align:middle}
 .sys::before{content:"{";position:absolute;left:0;top:50%;font-size:1.1em;line-height:1;transform:translateY(-50%) scaleY(2.15);font-weight:300}
 .stk{display:inline-flex;flex-direction:column;align-items:center;gap:.15em;vertical-align:middle}
 .rt>span{border-top:max(1.5px,.06em) solid currentColor;padding:0 .08em;margin-left:.04em}
 .gap{display:inline-block;width:1.1em}
 .qx .hand{display:flex;justify-content:center;gap:var(--gap,8px);white-space:normal}
 .nline{font:600 15px system-ui,sans-serif;color:var(--muted);margin-top:8px}
 .nline .v{font:italic 600 1.15em var(--math);color:var(--gold)}

 /* ---------- 21X cards ---------- */
 .card{position:relative;flex:none;width:var(--cw,100px);height:calc(var(--cw,100px) * 1.4);border-radius:calc(var(--cw,100px) * .09);
  background:linear-gradient(160deg,#fffdf7,#f1e7d0);color:var(--ink);container-type:inline-size;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 1px 0 #fff inset,0 2px 0 #0004,0 6px 14px #0007}
 .fx{font-family:var(--math);font-size:min(30cqw,calc(88cqw / var(--fw)));line-height:1.08;white-space:nowrap;text-align:center;font-weight:600;padding-bottom:2cqw}
 .fx .v{font-style:italic;font-weight:600}
 .fx .o{margin:0}
 .fx .o.b{margin:0 .2em 0 .27em}
 .fx .p{font-weight:400}
 .cn{position:absolute;display:flex;flex-direction:column;gap:1.6cqw}
 .cn.tl{top:5cqw;left:5cqw}
 .cn.br{bottom:5cqw;right:5cqw;transform:rotate(180deg)}
 .sh{width:.9em;height:.9em;display:inline-block;vertical-align:-.08em;margin-right:.08em}
 .cn .sh{width:10.5cqw;height:10.5cqw;display:block;margin:0}
 .sh-t{fill:var(--tri)} .sh-s{fill:var(--sq)} .sh-p{fill:var(--pent)}
 .val{position:absolute;left:50%;bottom:3.5cqw;transform:translateX(-50%);background:#1b2130;color:#fff;font:800 12cqw/1.15 system-ui,sans-serif;padding:1cqw 4.5cqw;border-radius:99px;white-space:nowrap}
 .mf{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.62em;line-height:1;text-align:center;margin-left:.08em}
 .mf span:last-child{border-top:1px solid currentColor}

 /* ---------- results ---------- */
 .score{display:flex;justify-content:center;gap:34px;margin:14px 0 4px;text-align:center}
 .score b{display:block;font:800 50px/1.05 system-ui,sans-serif;font-variant-numeric:tabular-nums}
 .score small{color:var(--muted);font-size:13.5px}
 .verdict{text-align:center;margin:6px 0 12px;font-weight:600}
 .rev{list-style:none;margin:8px 0;padding:0}
 .rev li{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:12px;padding:8px 11px 9px;margin:8px 0}
 .rev li.no{border-left-color:var(--bad)}
 .rev .rh{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;font-weight:600}
 .rev .rq{font-family:var(--math);font-size:22px;line-height:1.3;margin:4px 0 2px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding:2px 0}
 .rev .rq .hand{display:flex;gap:6px;--cw:62px}
 .rev .rq .nline{font-size:12.5px;margin-top:4px}
 .rev .ra{font-size:15px}
 .rev .ra .v,.rev .ra .mat{font-family:var(--math)}
 .rev .why{font-size:13.5px}

 /* ---------- overlays ---------- */
 #fx{position:fixed;inset:0;pointer-events:none;z-index:60}
 .toast{position:absolute;left:50%;top:calc(var(--sat) + 56px);transform:translateX(-50%);background:#000000d8;border:1px solid #ffffff22;padding:9px 15px;border-radius:12px;font-weight:600;max-width:92vw;text-align:center;animation:toast 2.6s ease forwards;white-space:normal}
 @keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}7%{opacity:1;transform:translate(-50%,0)}82%{opacity:1}100%{opacity:0}}
 .ov{position:fixed;inset:0;background:#000000c4;display:flex;align-items:center;justify-content:center;z-index:40;padding:16px;animation:fade .15s}
 @keyframes fade{from{opacity:0}}
 .sheet{background:#13201b;border:1px solid var(--line);border-radius:18px;padding:18px 16px;max-width:440px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;text-align:center}
 .sheet h2{margin:0 0 4px;color:var(--gold2);font-size:24px}
 .sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
 .sheet .btns.one{grid-template-columns:1fr}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<script type="text/plain" id="cards-csv">__CARDS_CSV__</script>
<script>__CARDS_JS__</script>
<script>__LIB_JS__</script>
<script>__APP_JS__</script>
</body>
</html>
